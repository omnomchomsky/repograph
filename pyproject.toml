[project]
name = "repograph"
version = "0.1.0"
description = "Rust semantic code graphs from Cargo metadata and SCIP, stored in Neo4j"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j",
    "protobuf>=6.31.1,<8",
]

[project.scripts]
repograph = "repograph.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["repograph*"]

[tool.setuptools.package-data]
"repograph.proto" = ["*.proto", "LICENSE", "README.md"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
